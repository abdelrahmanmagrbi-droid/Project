                    extend: {

                            ibm: ['IBM Plex Sans Arabic', 'Segoe UI', 'Tahoma', 'Arial', 'sans-serif'],

    <style>
        /* Base UI Styles */
        body {
            font-family: 'Cairo', 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* A4 Page Dimensions & Scaling */
        .a4-container {
            width: 210mm;
            min-height: 297mm;
            background: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        /* Responsive Preview Scaling on smaller viewports */
        @media screen and (max-width: 1280px) {
            .preview-scale-wrapper {
                transform: scale(0.82);
                transform-origin: top center;
                margin-bottom: -50mm;
            }
        }
        @media screen and (max-width: 1024px) {
            .preview-scale-wrapper {
                transform: scale(0.85);
                transform-origin: top center;
                margin-bottom: -40mm;
            }
        }
        @media screen and (max-width: 768px) {
            .preview-scale-wrapper {
                transform: scale(0.46);
                transform-origin: top center;
                margin-bottom: -155mm;
            }
        }
        @media screen and (max-width: 420px) {
            .preview-scale-wrapper {
                transform: scale(0.39);
                transform-origin: top center;
                margin-bottom: -178mm;
            }
        }

        /* Print Media Query - Exact A4 Output without UI Chrome */
        @media print {
            @page {
                size: A4;
                margin: 0;
            }
            html, body {
                width: 210mm;
                height: 297mm;
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print {
                display: none !important;
            }
            #preview-pane {
                display: block !important;
                width: 100% !important;
                height: auto !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
                background: #ffffff !important;
                position: static !important;
            }
            .preview-scale-wrapper {
                transform: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .a4-container {
                width: 210mm !important;
                min-height: 297mm !important;
                box-shadow: none !important;
                margin: 0 !important;
                border-radius: 0 !important;
            }
        }

        :root {
            --cv-accent: #1e40af;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

                </div>

            </div>
        </div>
    </div>

    <!-- Top Navigation / Action Toolbar -->

        <!-- Brand Logo -->

            <div class="w-9 h-9 rounded-xl bg-blue-700 text-white flex items-center justify-center shadow-sm">
                <i class="fa-solid fa-file-signature text-lg"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-bold text-slate-800 leading-tight" data-ui="appTitle">مصمم السيرة الذاتية</h1>
                <p class="text-[11px] text-slate-500 hidden sm:block" data-ui="appSubtitle">أنشئ سيرتك الذاتية باحترافية وصدّرها بصيغة PDF</p>
            </div>
        </div>

        <!-- Mobile View Switcher -->
        <div class="flex lg:hidden bg-slate-100 p-1 rounded-xl border border-slate-200">

            </button>
            <button type="button" onclick="setMobileView('preview')" id="mob-btn-preview" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 transition">
                <i class="fa-solid fa-eye ml-1"></i> <span data-ui="previewTab">المعاينة</span>
            </button>
        </div>

        <!-- Global Controls -->
        <div class="flex items-center gap-2 flex-wrap">
            <!-- CV Language Toggle (AR / EN) -->
            <div class="flex items-center bg-slate-100 rounded-xl p-1 border border-slate-200" title="لغة السيرة الذاتية / CV Language">
                <button type="button" onclick="setCVLanguage('ar')" id="lang-btn-ar" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-blue-700 text-white transition">عربي</button>
                <button type="button" onclick="setCVLanguage('en')" id="lang-btn-en" class="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition">English</button>
            </div>

            <!-- Sample & Clear Actions -->
            <button type="button" onclick="handleLoadSample()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 transition flex items-center gap-1.5">
                <i class="fa-solid fa-wand-magic-sparkles"></i>

            </button>

                <span class="hidden md:inline" data-ui="clearAll">مسح الكل</span>

            </div>
        </section>

        // ==========================================
        // 2. SAFE STORAGE & INITIALIZATION
        // ==========================================

        function safeSaveStorage(payloadStr) {
            try {
                if (window.localStorage) {
                    window.localStorage.setItem(STORAGE_KEY, payloadStr);
                    return true;
                }
            } catch (err) {
                // Restricted sandbox / private mode fallback
            }
            memoryFallbackStorage = payloadStr;
            return false;
        }

        function safeLoadStorage() {
            try {
                if (window.localStorage) {
                    const item = window.localStorage.getItem(STORAGE_KEY);
                    if (item) return item;
                }
            } catch (err) {
                // Restricted sandbox / private mode fallback
            }
            return memoryFallbackStorage;
        }

        function normalizeData(raw) {
            const base = JSON.parse(JSON.stringify(SAMPLE_DATA_AR));
            if (!raw || typeof raw !== 'object') return base;
            return {
                lang: raw.lang === 'en' ? 'en' : 'ar',
                design: {
                    template: ['modern', 'classic', 'executive'].includes(raw.design?.template) ? raw.design.template : 'modern',
                    color: typeof raw.design?.color === 'string' && /^#[0-9a-fA-F]{6}$/.test(raw.design.color) ? raw.design.color : '#1e40af',
                    font: ['cairo', 'tajawal', 'ibm', 'inter', 'roboto'].includes(raw.design?.font) ? raw.design.font : 'cairo'
                },
                personal: {
                    fullName: String(raw.personal?.fullName || ''),
                    jobTitle: String(raw.personal?.jobTitle || ''),
                    email: String(raw.personal?.email || ''),
                    phone: String(raw.personal?.phone || ''),
                    location: String(raw.personal?.location || ''),

                    photo: typeof raw.personal?.photo === 'string' && raw.personal.photo.startsWith('data:image/') ? raw.personal.photo : '',

                experience: Array.isArray(raw.experience) ? raw.experience : [],
                education: Array.isArray(raw.education) ? raw.education : [],
                skills: Array.isArray(raw.skills) ? raw.skills : [],
                projects: Array.isArray(raw.projects) ? raw.projects : [],
                languages: Array.isArray(raw.languages) ? raw.languages : [],
                certifications: Array.isArray(raw.certifications) ? raw.certifications : []
            };
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-slate-800' : type === 'error' ? 'bg-rose-600' : 'bg-blue-700';
            const icon = type === 'success' ? 'fa-circle-check text-emerald-400' : type === 'error' ? 'fa-circle-xmark text-white' : 'fa-circle-info text-blue-200';

            toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-semibold flex items-center gap-2.5 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${escapeHTML(message)}</span>`;

            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            modal.classList.remove('hidden');

            const okBtn = document.getElementById('confirm-ok-btn');
            const cancelBtn = document.getElementById('confirm-cancel-btn');

            const cleanup = () => {
                modal.classList.add('hidden');
                okBtn.onclick = null;
                cancelBtn.onclick = null;
            };

            okBtn.onclick = () => {
                cleanup();
                onConfirm();
            };
            cancelBtn.onclick = cleanup;
        }

        function exportJSON() {
            document.getElementById('backup-menu').classList.add('hidden');
            try {
                const jsonString = JSON.stringify(cvData, null, 2);
                const safeBaseName = (cvData.personal.fullName || 'resume').trim().replace(/[^a-zA-Z0-9\u0600-\u06FF_-]+/g, '_') || 'resume';
                const fileName = `${safeBaseName}_CV.json`;

                if (typeof Blob !== 'undefined' && typeof URL !== 'undefined' && URL.createObjectURL) {
                    const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                } else {
                    const dataStr = 'data:application/json;charset=utf-8,' + encodeURIComponent(jsonString);
                    const link = document.createElement('a');
                    link.href = dataStr;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                }

                showToast(cvData.lang === 'ar' ? 'تم تصدير ملف البيانات بنجاح' : 'JSON backup exported');
            } catch (err) {
                showToast(cvData.lang === 'ar' ? 'حدث خطأ أثناء تصدير الملف' : 'Failed to export JSON file', 'error');
            }
        }

        function importJSON(event) {
            document.getElementById('backup-menu').classList.add('hidden');
            const file = event?.target?.files?.[0];
            if (!file) return;

            const applyImportedText = (textContent) => {
                const parsed = JSON.parse(textContent);
                if (!parsed || typeof parsed !== 'object' || !parsed.personal) {
                    throw new Error('Invalid CV structure');
                }
                cvData = normalizeData(parsed);
                syncDesignControls();
                updateLanguageUI();
                renderForm();
                renderCV();
                saveState();
                showToast(cvData.lang === 'ar' ? 'تم استعادة البيانات بنجاح' : 'Resume data restored successfully');
            };

            try {
                if (typeof FileReader !== 'undefined') {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            applyImportedText(e.target.result);
                        } catch (parseErr) {
                            showToast(cvData.lang === 'ar' ? 'ملف JSON غير صالح!' : 'Invalid JSON file!', 'error');
                        }
                    };
                    reader.onerror = () => {
                        showToast(cvData.lang === 'ar' ? 'تعذر قراءة الملف المحدد' : 'Unable to read selected file', 'error');
                    };
                    reader.readAsText(file);
                } else if (typeof file.text === 'function') {
                    file.text().then(applyImportedText).catch(() => {
                        showToast(cvData.lang === 'ar' ? 'ملف JSON غير صالح!' : 'Invalid JSON file!', 'error');
                    });
                } else {
                    throw new Error('FileReader unsupported');
                }
            } catch (err) {
                showToast(cvData.lang === 'ar' ? 'قراءة الملفات غير مدعومة في هذا الوضع' : 'File reading restricted in this context', 'error');
            } finally {
                event.target.value = '';
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function updatePersonal(field, value) {
            cvData.personal[field] = value;
            renderCV();
            saveState();

            const file = event?.target?.files?.[0];

                showToast(cvData.lang === 'ar' ? 'يرجى اختيار ملف صورة صالح' : 'Please select a valid image file', 'error');
                return;
            }

            if (file.size > 2 * 1024 * 1024) {
                showToast(cvData.lang === 'ar' ? 'حجم الصورة يجب أن يكون أقل من 2 ميجابايت' : 'Image size must be under 2MB', 'error');
                return;
            }

            try {
                if (typeof FileReader !== 'undefined') {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        cvData.personal.photo = e.target.result;
                        renderForm();
                        renderCV();
                        saveState();
                    };
                    reader.onerror = () => {
                        showToast(cvData.lang === 'ar' ? 'تعذر تحميل الصورة' : 'Could not load image', 'error');
                    };
                    reader.readAsDataURL(file);
                } else {
                    showToast(cvData.lang === 'ar' ? 'رفع الصور غير متاح في هذا المتصفح' : 'Image upload unavailable here', 'error');
                }
            } catch (err) {
                showToast(cvData.lang === 'ar' ? 'تعذر معالجة الصورة' : 'Failed to process image', 'error');
            } finally {
                event.target.value = '';
            }
        }

                certifications: { id, name: '', issuer: '', year: '' }
            };
            cvData[section].push(templates[section]);
            renderForm();
            renderCV();
            saveState();
        }

        function updateItem(section, index, field, value) {
            cvData[section][index][field] = value;
            renderCV();
            saveState();

            cvData[section].splice(index, 1);
            renderForm();
            renderCV();
            saveState();
        }

        function moveItem(section, index, direction) {
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= cvData[section].length) return;
            const temp = cvData[section][index];
            cvData[section][index] = cvData[section][targetIndex];
            cvData[section][targetIndex] = temp;
            renderForm();
            renderCV();
            saveState();
        }

        function formatMultiline(text) {
            if (!text) return '';
            return escapeHTML(text)
                .split('\n')
                .filter(line => line.trim() !== '')
                .map(line => `<div class="mb-1 leading-relaxed">${line}</div>`)
                .join('');
        }

        function renderCV() {
            const doc = document.getElementById('cv-document');
            const isAr = cvData.lang === 'ar';

            doc.style.setProperty('--cv-accent', color);

            const fontMap = {
                cairo: "'Cairo', 'Segoe UI', 'Tahoma', 'Arial', sans-serif",
                tajawal: "'Tajawal', 'Segoe UI', 'Tahoma', 'Arial', sans-serif",
                ibm: "'IBM Plex Sans Arabic', 'Segoe UI', 'Tahoma', 'Arial', sans-serif",
                inter: "'Inter', 'Segoe UI', 'Roboto', 'Arial', sans-serif",
                roboto: "'Roboto', 'Inter', 'Arial', sans-serif"

            doc.style.fontFamily = fontMap[font] || fontMap.cairo;

            const contactItems = [
                p.email ? { icon: 'fa-envelope', val: p.email, ltr: true } : null,
                p.phone ? { icon: 'fa-phone', val: p.phone, ltr: true } : null,
                p.location ? { icon: 'fa-location-dot', val: p.location, ltr: false } : null,
                p.website ? { icon: 'fa-globe', val: p.website, ltr: true } : null

            if (template === 'modern') {
                doc.innerHTML = `

                            ${contactItems.length > 0 ? `

                                            <i class="fa-solid ${item.icon} mt-0.5 w-3.5 text-center text-white/80 shrink-0"></i>
                                            <span class="break-all" ${item.ltr ? 'dir="ltr"' : ''}>${escapeHTML(item.val)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}

                            ${cvData.skills.length > 0 ? `
                                <div class="space-y-3 pt-4 border-t border-white/20">
                                    <h3 class="text-xs font-bold uppercase tracking-wider text-white/75">${labels.cvSkills}</h3>
                                    <div class="space-y-2.5">
                                        ${cvData.skills.map(sk => `
